services:
  hub:
    build: .
    image: mcpdbhub:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MCPDBHUB_PUBLIC_URL: http://127.0.0.1:8080
    volumes:
      - hub-data:/data
      - ./databases:/databases:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  hub-data:
