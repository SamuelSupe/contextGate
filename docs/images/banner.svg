<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title description">
  <title id="title">MCP DB Hub</title>
  <desc id="description">Native read-only database access for agents. Eighteen database products, eleven MCP tools, one self-hosted service.</desc>
  <rect width="1280" height="380" rx="20" fill="#10252d"/>
