name: Feature request
description: Describe a database reading or administration workflow you need.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: For a database feature, include the product, version and a read-only query example.
    validations:
      required: true
